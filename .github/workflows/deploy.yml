name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site to server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # DEPLOY_PATH is the git clone on the server (source of truth, updated
      # via git pull). The site is actually served from /var/www/oseliocandido.tech,
      # so every deploy re-syncs that clone into the serve path afterward —
      # repo-only files (.git, .github, scripts, deploy) never reach it.
      - name: Deploy (git pull + sync to serve path)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.HOST }}" '
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git checkout -- sitemap.xml robots.txt
            git pull --ff-only
            python3 scripts/generate_sitemap.py
            rsync -a --delete \
              --exclude ".git" --exclude ".github" --exclude "scripts" --exclude "deploy" \
              ./ /var/www/oseliocandido.tech/
          '

      - name: Verify deployment
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.HOST }}" '
            test -f /var/www/oseliocandido.tech/index.html && echo "Deploy verified: index.html present"
          '
